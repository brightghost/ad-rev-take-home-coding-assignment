

services:
  postgres:
    image: postgres:15
    container_name: adrev-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./demo
      dockerfile: Dockerfile
    container_name: adrev-demo-app
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/demo
      SPRING_DATASOURCE_USERNAME: demo
      SPRING_DATASOURCE_PASSWORD: demo
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:18-alpine
    container_name: adrev-demo-frontend
    restart: unless-stopped
    working_dir: /usr/src/app
    volumes:
      - ./demo/frontend:/usr/src/app:delegated
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BROWSER=none
      - HOST=0.0.0.0
      - PORT=3000
    command: sh -c "npm install --silent && npm start"
    depends_on:
      - app

volumes:
  postgres_data:
    name: adrev-demo-postgres-data
